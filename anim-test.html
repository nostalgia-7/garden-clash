<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>动画自检 · Garden Clash</title>
    <style>
      body { margin: 0; padding: 20px; background: #1b1f18; color: #dfe6d5;
             font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      #status { color: #9fb08c; margin-bottom: 16px; }
      #grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .cell { background: #2a3226; border: 1px solid #3d4837; border-radius: 6px;
              padding: 6px; }
      .cell canvas { display: block;
                     background: repeating-conic-gradient(#242a20 0 25%, #2c3327 0 50%)
                                 0 0 / 16px 16px; }
      .cap { text-align: center; font-size: 12px; color: #9fb08c; padding-top: 5px; }
    </style>
  </head>
  <body>
    <h1>reanim 动画自检</h1>
    <div id="status">加载中…</div>
    <div id="grid"></div>
    <script type="module" src="/src/anim-test.ts"></script>
  </body>
